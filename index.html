<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Interface Responsive</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/Accueil.js" defer></script>
</head>

<body class="p-3">
    <!-- Menu Burger Persistant (Bootstrap) -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">
                <i class="fas fa-calendar-alt me-2"></i>AIO-main
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link active" href="index.html">
                            <i class="fas fa-home me-1"></i>Accueil
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="agenda.html">
                            <i class="fas fa-calendar me-1"></i>Agenda
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="bloc-note.html">
                            <i class="fas fa-sticky-note me-1"></i>Mémos
                        </a>
                    </li>
                </ul>
                <div class="d-flex align-items-center">
                    <input type="text" class="form-control form-control-sm me-2" placeholder="Recherche" style="max-width: 200px;">
                    <a href="#" class="btn btn-outline-light btn-sm">
                        <i class="fas fa-cog"></i>
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <div class="page" style="margin-top: 60px;">

        <!-- Weather Widget -->
        <div id="weather" class="weather-card">
            <div class="weather-loader">
                <div class="loader-spinner"></div>
                <p>Chargement de la météo...</p>
            </div>
        </div>
    </div>

    <!-- Events -->
    <div class="body_app">
        <div class="notif">
            <div class="notif -blue">
                <div class="notif_content">
                    <div class="notif_content_date">
                        <span class="date">30/12</span>
                        <span class="year">2025</span>
                    </div>
                    <div class="notif_content_title">
                        Rendez-vous garage pour changer les pneus ...
                    </div>
                    <div class="notif_content_action">
                        <img src="images/chevron-right.png" alt="">
                    </div>
                </div>
            </div>
            <div class="notif -purple">
                <div class="notif_content">
                    <div class="notif_content_date">
                        <span class="date">16/04</span>
                        <span class="year">2025</span>
                    </div>
                    <div class="notif_content_title">
                        Rendez-vous docteur
                    </div>
                    <div class="notif_content_action">
                        <img src="images/chevron-right.png" alt="">
                    </div>
                </div>
            </div>
        </div>

        <div class="btn_bleu">
            <a class="btn_bleu_text" href="agenda.html">Tout voir</a>
        </div>

        <!-- Timer -->
        <div class="text-center">
            <p class="text-uppercase">Minuteur</p>
            <div class="minuteur">00:00:00</div>
            <button class="btn btn-start">Demarrer</button>
        </div>

        <!-- Bottom Icons -->
        <div class="bottom-icons">
            <div class="icon-box">
                <img src="images/memo-removebg-preview.png" alt="Edit">
                <img src="images/mail-removebg-preview.png" alt="Email">
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./js/Timer.js" defer></script>
    <script src="./js/script.js" defer></script>
</body>

</html>
