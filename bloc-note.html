<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bloc-note</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="./css/style.css">
  <script src="./js/Bloc-note.js" defer></script>
</head>
<body>
  <!-- Menu Burger Persistant (Bootstrap) -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
    <div class="container-fluid">
      <a class="navbar-brand" href="index.html">
        <i class="fas fa-calendar-alt me-2"></i>AIO-main
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link" href="index.html">
              <i class="fas fa-home me-1"></i>Accueil
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="agenda.html">
              <i class="fas fa-calendar me-1"></i>Agenda
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" href="bloc-note.html">
              <i class="fas fa-sticky-note me-1"></i>Mémos
            </a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container-fluid mt-5 pt-3">
    <div class="container">
      <h2 class="mb-4"><i class="fas fa-sticky-note me-2"></i>Bloc-note</h2>

      <!-- Zone de saisie -->
      <div class="mb-3">
        <textarea id="noteInput" class="form-control" rows="3" placeholder="Écris ta note ici..."></textarea>
      </div>
      <button id="addNoteBtn" class="btn btn-primary mb-4">Ajouter la note</button>

      <!-- Liste des notes -->
      <div id="notesList" class="row g-3"></div>
    </div>
  </main>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="./js/script.js" defer></script>
